    result: >
      No X-RateLimit-*, RateLimit-* (RFC 9331 draft) or Retry-After header was
      returned on either the unauthenticated 200 or the unauthenticated 401.
      Response headers carry only content-type, etag, x-powered-by (Express),
      x-robots-tag, x-tldx-trace-id, strict-transport-security and Cloudflare's
      cf-ray / cf-cache-status.
    note: >
      Authenticated endpoints were not probed — this pipeline holds no tl;dv
      API key — so it remains possible that rate limit headers are emitted only
      on authenticated responses. Recorded as unobserved, not as absent.
