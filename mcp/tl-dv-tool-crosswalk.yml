  name-similarity guess. The live tools/list on https://mcp.tldv.io/mcp is
  OAuth-gated (HTTP 401), so the runtime inputSchema could not be introspected
  anonymously; the input contract recorded per row is the backing operation's
  parameters, which is the real contract the handler forwards to.
