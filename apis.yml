name: tl;dv
description: >-
  tl;dv is an AI meeting notetaker for Zoom, Google Meet and Microsoft Teams that
  automatically records, transcribes and summarizes meetings in 30+ languages and
  syncs the resulting insights into CRMs and productivity tools. Its public API
  (base URL https://pasta.tldv.io, version v1alpha1) gives developers programmatic
  access to meetings, speaker-attributed transcripts and AI-generated notes, plus
  meeting import from a URL and webhook delivery of MeetingReady and TranscriptReady
  events. Authentication is via an x-api-key header issued from account settings.
