note: >
  tl;dv publishes NO first-party client SDK in any package registry. npm, PyPI,
  RubyGems, crates.io, Packagist, NuGet, Maven Central and pkg.go.dev were all
  searched on 2026-08-14 and none carries a tl;dv-authored library. The API
  reference at doc.tldv.io documents raw HTTP with an x-api-key header and links
  no SDK. The single piece of first-party distributable code tl;dv ships is the
  MCP server, and it is distributed as SOURCE ONLY — the GitHub org tldv-public
  contains exactly one repository and it has never been published to npm, so a
  consumer must clone and build (Docker or `npm run build`) rather than install.
  Several npm packages with tl;dv-shaped names exist; every one of them is
  third-party and is recorded below as official: false so the catalog does not
  credit tl;dv with SDKs it did not ship.
