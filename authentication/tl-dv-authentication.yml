schemes:
  - name: ApiKeyAuth
    type: apiKey
    in: header
    parameter: x-api-key
    description: >
      All requests authenticate with an API key sent on the x-api-key header.
      Keys are issued per user from tl;dv account settings and can be scoped to
      user, team, or organization context.
