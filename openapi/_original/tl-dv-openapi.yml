        name: { type: string }
        happenedAt: { type: string, format: date-time }
    ImportMeetingResponse:
      type: object
      properties:
        success: { type: boolean }
        jobId: { type: string }
        message: { type: string }
    Error:
      type: object
      properties:
        name: { type: string }
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              property: { type: string }
              constraints: { type: object, additionalProperties: { type: string } }
