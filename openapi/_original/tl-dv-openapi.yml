components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        API key issued from tl;dv account settings
        (https://tldv.io/app/settings/personal-settings/api-keys), sent on the
        x-api-key request header.
  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema: { type: string }
      description: Unique identifier of the meeting.
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The API key is not permitted to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Meeting:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        happenedAt: { type: string, format: date-time }
        url: { type: string, format: uri }
        duration: { type: number, description: Meeting duration in seconds. }
        organizer:
          $ref: '#/components/schemas/Person'
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        template: { type: string }
        extraProperties:
          type: object
          properties:
            conferenceId: { type: string }
    Person:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
    MeetingList:
      type: object
      properties:
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
        pageSize: { type: integer }
        results:
          type: array
          items:
            $ref: '#/components/schemas/Meeting'
    Transcript:
      type: object
      properties:
        id: { type: string }
        meetingId: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              speaker: { type: string }
              text: { type: string }
              startTime: { type: number }
              endTime: { type: number }
    Notes:
      type: object
      properties:
        meetingId: { type: string }
        markdownContent: { type: string }
        structuredNotes:
          type: array
          items:
            type: object
            properties:
              segmentId: { type: string }
              timestamp: { type: number }
              text: { type: string }
              topicId: { type: string }
        topics:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              order: { type: integer }
              title: { type: string }
              summary: { type: string }
    ImportMeetingRequest:
