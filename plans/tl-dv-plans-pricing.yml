note: >
  Read from the schema.org SoftwareApplication/Offer JSON-LD block embedded in
  tl;dv's own pricing page — a machine-readable price list, hence method:
  probed rather than searched. Prices are seat-based and quoted in EUR by the
  provider. The JSON-LD carries price and billing period only; it carries no
  feature or quota breakdown, and the human-readable comparison table on the
  same page is rendered client-side, so per-tier quotas are NOT recorded here
  rather than being guessed. Third-party review sites publish USD figures and
  feature lists that disagree with the provider's own EUR numbers; none of
  that is used.
  IMPORTANT: https://tldv.io/pricing/ returns 404 — the live pricing page is at
  /app/pricing/.
